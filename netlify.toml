[build]
  command = "npm --prefix client install && npm --prefix server install && npm --prefix client run build"
  publish = "client/out"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin API: the UI calls /api, and the redirect below sends it to the
  # Express app running as a Netlify Function.
  NEXT_PUBLIC_API_URL = "/api"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep UI and API on the same origin: no CORS, no extra environment variables.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
